name: trailfinder
services:

  db:
    image: postgis/postgis:15-3.3-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data

    environment:
      - POSTGRES_DB=trails
      - POSTGRES_USER=finder
      - POSTGRES_PASSWORD_FILE=/run/secrets/db_password
    secrets:
      - db_password

  server:
    #image: lusiolla/trailfinder:v0.1.1_alpha_2026-05-22
    build: .

    ports:
      - "8080:8080"

    depends_on:
      - db

    environment:
      - DB_NAME=trails
      - POSTGRES_USER=finder
      - POSTGRES_PASSWORD_FILE=/run/secrets/db_password
      - DB_HOST=db
      - DB_PORT=5432
    secrets:
      - db_password

secrets:
  db_password:
    file: ./secrets/db_password

volumes:
  postgres_data: